<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mina-agent</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#161a22; --line:#252b37; --fg:#d6dae2; --dim:#8a92a3; --ok:#4fbf7f; --bad:#e5645f; --info:#5aa9e6; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { position:sticky; top:0; background:var(--bg); display:flex; align-items:baseline; gap:14px; padding:8px 14px; border-bottom:1px solid var(--line); z-index:1 }
  header h1 { margin:0; font-size:14px; letter-spacing:.06em }
  .live { color:var(--dim) } .live.on { color:var(--ok) }
  input { background:var(--panel); border:1px solid var(--line); color:var(--fg); font:inherit; padding:2px 8px; border-radius:3px; width:280px }
  details { border-bottom:1px solid var(--line) }
  summary { list-style:none; cursor:pointer; padding:5px 14px; display:grid; grid-template-columns: 110px 130px 1fr; gap:12px; align-items:baseline }
  summary::-webkit-details-marker { display:none }
  summary:hover { background:var(--panel) }
  .ts { color:var(--dim); font-size:12px } .src { color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .ok { color:var(--ok) } .bad { color:var(--bad) } .info { color:var(--info) } .dim { color:var(--dim) }
  .run\.start summary, .run\.end summary { font-weight:600 }
  .body { background:var(--panel); padding:8px 14px 12px 266px; font-size:12px; color:#c2c8d4 }
  .kv { display:grid; grid-template-columns: max-content 1fr; gap:2px 14px; margin:2px 0 }
  .kv > .k { color:var(--dim); white-space:nowrap } .kv > .v { min-width:0; overflow-wrap:anywhere }
  .nest { border-left:1px solid var(--line); padding-left:10px; margin:2px 0 }
  table { border-collapse:collapse; margin:4px 0 6px } th, td { text-align:left; vertical-align:top; padding:2px 10px 2px 0; border-bottom:1px solid var(--line) }
  th { color:var(--dim); font-weight:500 }
  pre { margin:2px 0; white-space:pre-wrap; overflow-wrap:anywhere; max-height:420px; overflow:auto }
  .true { color:var(--ok) } .false { color:var(--bad) } .null { color:var(--dim) }
  .empty { padding:20px 14px; color:var(--dim) }
</style>
</head>
<body>
<header>
  <h1>mina-agent</h1>
  <span id="live" class="live">connecting</span>
  <input id="filter" placeholder="filter (e.g. hook, BLOCKED, harness.build)">
  <span class="dim" id="count"></span>
</header>
<div id="stream"><div class="empty">loading</div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const open = new Set();
let filter = "";
const fmtTs = ts => ts.replace(/#.*$/, "").replace("T", " ").replace(/\+00:00$/, "").slice(5, 16);
const isScalar = v => v === null || ["string", "number", "boolean"].includes(typeof v);
const isPlainObj = v => v && typeof v === "object" && !Array.isArray(v);

// Schema-free renderer: objects -> key/value rows, arrays of objects -> a
// table on the union of keys, arrays of scalars -> inline list, long or
// multi-line strings -> a wrapped block.
function render(v, depth = 0) {
  if (v === null || v === undefined) return '<span class="null">—</span>';
  if (typeof v === "boolean") return `<span class="${v}">${v}</span>`;
  if (typeof v === "number") return esc(v);
  if (typeof v === "string") return (v.length > 100 || v.includes("\n")) ? `<pre>${esc(v)}</pre>` : esc(v);
  if (Array.isArray(v)) {
    if (!v.length) return '<span class="null">none</span>';
    if (v.every(isScalar)) return esc(v.join(", "));
    if (v.every(isPlainObj)) {
      const keys = [...new Set(v.flatMap(Object.keys))].filter(k => v.some(o => isScalar(o[k]) || Array.isArray(o[k]) && o[k].every(isScalar)));
      const rest = v.some(o => Object.keys(o).some(k => !keys.includes(k)));
      return `<table><tr>${keys.map(k => `<th>${esc(k)}</th>`).join("")}</tr>` +
        v.map(o => `<tr>${keys.map(k => `<td>${render(o[k], depth + 1)}</td>`).join("")}</tr>`).join("") + `</table>` +
        (rest ? v.map(o => renderObj(Object.fromEntries(Object.entries(o).filter(([k]) => !keys.includes(k))), depth + 1)).join("") : "");
    }
    return v.map(x => `<div class="nest">${render(x, depth + 1)}</div>`).join("");
  }
  return renderObj(v, depth);
}
function renderObj(o, depth) {
  const rows = Object.entries(o).filter(([, v]) => v !== undefined);
  if (!rows.length) return '<span class="null">none</span>';
  const inner = rows.map(([k, v]) => `<div class="k">${esc(k)}</div><div class="v">${render(v, depth + 1)}</div>`).join("");
  return `<div class="kv ${depth ? "nest" : ""}">${inner}</div>`;
}

async function refresh() {
  const evs = await (await fetch("/api/events")).json();
  const shown = evs.filter(e => !filter || (e.summary + " " + e.source).toLowerCase().includes(filter));
  $("#count").textContent = `${shown.length} events`;
  $("#stream").innerHTML = shown.map(e => `
    <details class="${esc(e.kind)}" data-id="${esc(e.id)}" ${open.has(e.id) ? "open" : ""}>
      <summary><span class="ts">${esc(fmtTs(e.ts))}</span><span class="src" title="${esc(e.source)}">${esc(e.phase)}</span>
        <span class="${esc(e.level)}">${esc(e.summary)}</span></summary>
      <div class="body">${render(e.detail)}</div>
    </details>`).join("") || '<div class="empty">no events yet</div>';
  document.querySelectorAll("details").forEach(d => d.addEventListener("toggle", () => d.open ? open.add(d.dataset.id) : open.delete(d.dataset.id)));
}
$("#filter").addEventListener("input", e => { filter = e.target.value.trim().toLowerCase(); refresh(); });
refresh();
const es = new EventSource("/events");
es.onopen = () => { $("#live").textContent = "live"; $("#live").classList.add("on"); };
es.onerror = () => { $("#live").textContent = "disconnected"; $("#live").classList.remove("on"); };
es.onmessage = () => refresh();
</script>
</body>
</html>
