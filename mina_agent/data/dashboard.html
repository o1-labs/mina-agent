<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mina-agent</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#161a22; --line:#252b37; --fg:#d6dae2; --dim:#8a92a3; --ok:#4fbf7f; --bad:#e5645f; --info:#5aa9e6; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { position:sticky; top:0; background:var(--bg); display:flex; align-items:baseline; gap:14px; padding:8px 14px; border-bottom:1px solid var(--line); z-index:1 }
  header h1 { margin:0; font-size:14px; letter-spacing:.06em }
  .live { color:var(--dim) } .live.on { color:var(--ok) }
  input { background:var(--panel); border:1px solid var(--line); color:var(--fg); font:inherit; padding:2px 8px; border-radius:3px; width:280px }
  details { border-bottom:1px solid var(--line) }
  summary { list-style:none; cursor:pointer; padding:5px 14px; display:grid; grid-template-columns: 150px 110px 1fr; gap:12px; align-items:baseline }
  summary::-webkit-details-marker { display:none }
  summary:hover { background:var(--panel) }
  .ts { color:var(--dim); font-size:12px } .src { color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .ok { color:var(--ok) } .bad { color:var(--bad) } .info { color:var(--info) } .dim { color:var(--dim) }
  .run\.start summary, .run\.end summary { font-weight:600 }
  pre { margin:0; padding:10px 14px 12px 276px; background:var(--panel); white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; color:#c2c8d4 }
  .empty { padding:20px 14px; color:var(--dim) }
</style>
</head>
<body>
<header>
  <h1>mina-agent</h1>
  <span id="live" class="live">connecting</span>
  <input id="filter" placeholder="filter (e.g. hook, BLOCKED, harness.build)">
  <span class="dim" id="count"></span>
</header>
<div id="stream"><div class="empty">loading</div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const open = new Set();
let filter = "";
function fmtTs(ts) { return ts.replace(/#.*$/, "").replace("T", " ").replace(/\+00:00$/, "Z").slice(5, 20); }
async function refresh() {
  const evs = await (await fetch("/api/events")).json();
  const shown = evs.filter(e => !filter || (e.summary + " " + e.source).toLowerCase().includes(filter));
  $("#count").textContent = `${shown.length} events`;
  $("#stream").innerHTML = shown.map(e => `
    <details class="${esc(e.kind)}" data-id="${esc(e.id)}" ${open.has(e.id) ? "open" : ""}>
      <summary><span class="ts">${esc(fmtTs(e.ts))}</span><span class="src" title="${esc(e.source)}">${esc(e.phase)}</span>
        <span class="${esc(e.level)}">${esc(e.summary)}</span></summary>
      <pre>${esc(JSON.stringify(e.detail, null, 2))}</pre>
    </details>`).join("") || '<div class="empty">no events yet</div>';
  document.querySelectorAll("details").forEach(d => d.addEventListener("toggle", () => d.open ? open.add(d.dataset.id) : open.delete(d.dataset.id)));
}
$("#filter").addEventListener("input", e => { filter = e.target.value.trim().toLowerCase(); refresh(); });
refresh();
const es = new EventSource("/events");
es.onopen = () => { $("#live").textContent = "live"; $("#live").classList.add("on"); };
es.onerror = () => { $("#live").textContent = "disconnected"; $("#live").classList.remove("on"); };
es.onmessage = () => refresh();
</script>
</body>
</html>
